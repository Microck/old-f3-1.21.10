plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'com.modrinth.minotaur' version '2.9.0'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def releaseVersion = project.mod_version.toString().replace('+', '-')

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

loom {
    mods {
        oldf3 {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property 'archivesName', project.base.archivesName

    from('LICENSE') {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

remapJar {
    archiveFileName = "${project.archives_base_name}-v${releaseVersion}.jar"
}

modrinth {
    token = System.getenv('MODRINTH_TOKEN')
    projectId = System.getenv('MODRINTH_PROJECT_ID') ?: 'old-f3'
    versionNumber = releaseVersion
    versionName = "Old F3 ${project.mod_version.toString().replace('+', ' for Minecraft ')}"
    versionType = 'release'
    uploadFile = remapJar
    gameVersions = [project.minecraft_version]
    loaders = ['fabric']
    changelog = System.getenv('RELEASE_NOTES') ?: 'See the GitHub release notes for this version.'

    dependencies {
        required.project 'fabric-api'
    }
}
